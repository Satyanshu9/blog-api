<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Nook — a cozy blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF4EA;
    --surface: #FFFCF7;
    --surface-soft: #FFF6EB;
    --line: #EDE0CE;
    --line-soft: #F2E8D8;
    --text: #4B3F33;
    --text-muted: #92806D;
    --text-dim: #BFAE99;
    --sage: #7C9683;
    --sage-deep: #5F7A67;
    --rose: #D98F92;
    --rose-deep: #C06E72;
    --honey: #E3A94E;
    --shadow-sm: 0 2px 10px rgba(90, 68, 40, 0.06);
    --shadow-md: 0 10px 30px rgba(90, 68, 40, 0.10);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background:
      radial-gradient(600px 380px at 8% 0%, rgba(216,175,124,0.16), transparent 60%),
      radial-gradient(700px 420px at 100% 12%, rgba(124,150,131,0.14), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }

  h1,h2,h3{ font-family:'Fraunces', serif; margin:0; letter-spacing:-0.01em; color: var(--text); }
  .mono{ font-family:'JetBrains Mono', monospace; }

  button, input, textarea, select{ font-family: inherit; }
  ::selection{ background: var(--honey); color: #3A2A10; }
  :focus-visible{ outline: 2px solid var(--sage-deep); outline-offset: 2px; border-radius: 4px; }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index: 20;
    display:flex; align-items:center; gap:16px;
    padding: 16px 26px;
    background: rgba(251,244,234,0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .leaf{
    width:30px; height:30px; border-radius:50%;
    background: linear-gradient(160deg, var(--sage), var(--sage-deep));
    display:flex; align-items:center; justify-content:center;
    font-size:15px; flex-shrink:0;
    box-shadow: var(--shadow-sm);
  }
  .brand h1{ font-size: 20px; font-weight:600; }
  .brand .tag{ font-size:11px; color:var(--text-dim); margin-left:2px; font-family:'Nunito'; }
  .status-dot{
    width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;
    background: var(--text-dim); transition: background .25s;
  }
  .status-dot.live{ background: var(--sage-deep); }
  .status-dot.down{ background: var(--rose-deep); }
  .status-dot.pending{ background: var(--honey); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .base-url{
    flex:1; display:flex; align-items:center; gap:8px;
    max-width: 480px;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: 999px;
    padding: 8px 8px 8px 16px;
    box-shadow: var(--shadow-sm);
  }
  .base-url span{ color:var(--text-dim); font-size:12px; }
  .base-url input{
    flex:1; background:none; border:none; color:var(--text);
    font-size:12.5px; outline:none;
  }
  .base-url button{
    background: var(--sage); border:none; color:#fff;
    font-size:11.5px; font-weight:600; padding:7px 14px; border-radius: 999px; cursor:pointer;
    transition: background .15s;
  }
  .base-url button:hover{ background: var(--sage-deep); }

  .status-label{ font-size:12px; color:var(--text-muted); white-space:nowrap; }

  /* ---------- Layout ---------- */
  .layout{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: 1fr 350px;
    max-width: 1320px;
    margin: 0 auto;
    min-height: calc(100vh - 66px);
    gap: 0;
  }
  .main{ padding: 34px 32px 90px; min-width:0; }
  .side{ padding: 34px 26px 90px; }

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:18px; gap:12px; flex-wrap:wrap;
  }
  .section-head .eyebrow{
    font-size:12px; letter-spacing:0.04em; color:var(--sage-deep); display:block; margin-bottom:4px; font-weight:700;
  }
  .section-head h2{ font-size:28px; }
  .section-head .count{ color:var(--text-dim); font-size:12.5px; }

  .ghost-btn{
    background: var(--surface); border:1px solid var(--line); color:var(--text-muted);
    font-size:13px; padding:8px 15px; border-radius: 999px; cursor:pointer;
    transition: all .15s; font-weight:600;
  }
  .ghost-btn:hover{ border-color: var(--rose); color: var(--rose-deep); }
  .solid-btn{
    background: var(--sage); border:none; color:#fff;
    font-weight:700; font-size:13px; padding:9px 18px; border-radius: 999px; cursor:pointer;
    transition: all .15s; box-shadow: var(--shadow-sm);
  }
  .solid-btn:hover{ background: var(--sage-deep); transform: translateY(-1px); }
  .solid-btn:disabled, .ghost-btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

  /* ---------- Post cards ---------- */
  .post-list{ display:flex; flex-direction:column; gap:14px; }
  .post-card{
    background: var(--surface);
    border:1px solid var(--line-soft);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .18s, transform .12s;
  }
  .post-card:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .post-card:active{ transform: translateY(0); }
  .post-card .idx{
    font-family:'JetBrains Mono', monospace; color:var(--text-dim); font-size:11px;
  }
  .post-card h3{ font-size:19px; margin:6px 0 8px; font-weight:600; }
  .post-card .meta{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    font-size:12.5px; color:var(--text-muted); margin-bottom:10px;
  }
  .post-card .meta b{ color:var(--text); font-weight:700; }
  .post-card .excerpt{ font-size:14px; color:var(--text-muted); line-height:1.65; }
  .tag-pill{
    font-size:11px; color:var(--rose-deep); font-weight:700;
    background: rgba(217,143,146,0.14); border:1px solid rgba(217,143,146,0.28);
    padding:3px 10px; border-radius:20px;
  }

  .empty{
    border:1.5px dashed var(--line); border-radius: var(--radius-md);
    padding: 32px 18px; text-align:center; color:var(--text-dim); font-size:13.5px;
    background: var(--surface-soft);
  }

  /* ---------- Forms ---------- */
  .form-card{
    background: var(--surface); border:1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 18px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
  }
  .form-card .row{ display:flex; gap:12px; margin-bottom:12px; }
  .form-card .row > *{ flex:1; }
  .field label{
    display:block; font-size:11.5px; font-weight:700;
    color: var(--text-muted); margin-bottom:6px;
  }
  .field input, .field textarea, .field select{
    width:100%; background: var(--surface-soft); border:1.5px solid var(--line); color:var(--text);
    border-radius: var(--radius-sm); padding:9px 12px; font-size:13.5px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color: var(--sage); }
  .field textarea{ resize:vertical; min-height:76px; font-family:inherit; }
  .form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .form-error{ color:var(--rose-deep); font-size:12.5px; margin-top:8px; font-weight:600; }

  /* ---------- Post detail (slide over) ---------- */
  .overlay{
    position: fixed; inset:0; background: rgba(74,60,42,0.28);
    z-index: 30; display:none; backdrop-filter: blur(2px);
  }
  .overlay.open{ display:block; }
  .drawer{
    position: fixed; top:0; right:0; height:100vh; width: min(560px, 100vw);
    background: var(--bg); border-left:1px solid var(--line);
    z-index:31; transform: translateX(100%); transition: transform .3s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform: translateX(0); }
  .drawer-head{
    padding:22px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .drawer-head .x{ background: var(--surface); border:1px solid var(--line); width:32px; height:32px; border-radius:50%; color:var(--text-muted); font-size:18px; cursor:pointer; line-height:1; flex-shrink:0; }
  .drawer-head .x:hover{ color:var(--rose-deep); border-color: var(--rose); }
  .drawer-body{ padding: 24px; overflow-y:auto; flex:1; }
  .drawer-body p{ line-height:1.8; color: var(--text-muted); font-size:15px; }
  .comment{
    border-bottom:1px solid var(--line-soft); padding: 14px 0;
  }
  .comment .who{ font-size:12.5px; color:var(--sage-deep); font-weight:700; margin-bottom:4px; }
  .comment .txt{ font-size:14px; color:var(--text); line-height:1.6; }

  /* ---------- Console ---------- */
  .console{
    background: var(--surface); border:1px solid var(--line-soft); border-radius: var(--radius-lg);
    height: 300px; display:flex; flex-direction:column; overflow:hidden; box-shadow: var(--shadow-sm);
  }
  .console-head{
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 16px; border-bottom:1px solid var(--line-soft); background: var(--surface-soft);
  }
  .console-head span{ font-size:11.5px; color:var(--text-dim); font-weight:700; }
  .console-head button{ background:none; border:none; color:var(--text-dim); font-size:11.5px; cursor:pointer; font-weight:700; }
  .console-head button:hover{ color:var(--rose-deep); }
  .console-log{ flex:1; overflow-y:auto; padding: 4px 0; font-family:'JetBrains Mono',monospace; font-size:11px; }
  .log-row{
    display:flex; gap:8px; align-items:baseline; padding: 6px 16px;
    border-bottom: 1px solid var(--line-soft);
    animation: slidein .18s ease;
  }
  @keyframes slidein{ from{ opacity:0; transform: translateY(-3px);} to{opacity:1; transform:none;} }
  .log-row .t{ color: var(--text-dim); flex-shrink:0; }
  .log-row .m{ flex-shrink:0; width:32px; font-weight:700; }
  .log-row .m.GET{ color:#7796B8; }
  .log-row .m.POST{ color: var(--sage-deep); }
  .log-row .m.PUT{ color: var(--honey); }
  .log-row .m.DELETE{ color: var(--rose-deep); }
  .log-row .p{ color: var(--text-muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .log-row .s{ flex-shrink:0; font-weight:700; }
  .log-row .s.ok{ color: var(--sage-deep); }
  .log-row .s.err{ color: var(--rose-deep); }
  .log-row .ms{ color: var(--text-dim); flex-shrink:0; }
  .console-empty{ color:var(--text-dim); padding: 18px 16px; font-size:12px; font-family:'Nunito'; }

  /* ---------- Stats ---------- */
  .stats-table{ width:100%; border-collapse: collapse; margin-top:12px; }
  .stats-table th{
    text-align:left; font-size:11px; font-weight:700;
    color:var(--text-dim); padding: 6px 10px; border-bottom:1px solid var(--line);
  }
  .stats-table td{ padding: 11px 10px; border-bottom:1px solid var(--line-soft); font-size:13.5px; }
  .stats-table tr:last-child td{ border-bottom:none; }
  .rank{ font-family:'JetBrains Mono',monospace; color: var(--rose-deep); font-size:12px; font-weight:700; }
  .bar-wrap{ background: var(--surface-soft); border-radius:6px; height:6px; margin-top:5px; overflow:hidden; }
  .bar{ height:100%; background: linear-gradient(90deg, var(--sage), var(--honey)); border-radius:6px; }

  .side h3.side-title{
    font-size:13px; color:var(--sage-deep); font-weight:700;
    margin-bottom:12px; margin-top:34px; font-family:'Fraunces', serif;
  }
  .side h3.side-title:first-child{ margin-top:0; }

  .toast{
    position: fixed; bottom:24px; left:50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 12px 20px; border-radius: 999px; font-size:13.5px; font-weight:600; z-index:50;
    opacity:0; transition: all .25s; pointer-events:none; box-shadow: var(--shadow-md);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
  .toast.err{ background: var(--rose-deep); }

  .user-row{
    padding:11px 0; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center;
  }
  .user-avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background: linear-gradient(160deg, var(--rose), var(--honey));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:12.5px; font-family:'Fraunces';
  }

  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; }
    .main{ border-bottom:1px solid var(--line); }
    .topbar{ flex-wrap:wrap; }
    .base-url{ order:3; max-width:none; width:100%; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="leaf">🌿</div>
    <h1>The Nook</h1>
    <span class="tag">a cozy little blog</span>
  </div>
  <div class="base-url">
    <span>API</span>
    <input id="base-url-input" type="text" value="https://blog-api-70xt.onrender.com" spellcheck="false">
    <button id="connect-btn">Connect</button>
  </div>
  <div class="status-label"><span class="status-dot pending" id="status-dot"></span><span id="status-label">connecting…</span></div>
</div>

<div class="layout">
  <div class="main">

    <!-- POSTS -->
    <div class="section-head">
      <div>
        <span class="eyebrow">From the notebook</span>
        <h2>Posts</h2>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="count" id="post-count">0 total</span>
        <button class="solid-btn" id="new-post-btn">+ Write a post</button>
      </div>
    </div>

    <div class="form-card" id="new-post-form" style="display:none;">
      <div class="row">
        <div class="field"><label>Title</label><input id="new-post-title" placeholder="On calibration drift"></div>
      </div>
      <div class="field" style="margin-bottom:12px;"><label>Body</label><textarea id="new-post-body" placeholder="Write the post…"></textarea></div>
      <div class="row">
        <div class="field">
          <label>Author</label>
          <select id="new-post-author"><option value="">— select someone —</option></select>
        </div>
        <div class="field"><label>Tags (comma separated)</label><input id="new-post-tags" placeholder="intro, notes"></div>
      </div>
      <div class="form-error" id="new-post-error"></div>
      <div class="form-actions">
        <button class="ghost-btn" id="cancel-post-btn">Cancel</button>
        <button class="solid-btn" id="submit-post-btn">Publish</button>
      </div>
    </div>

    <div class="post-list" id="post-list">
      <div class="empty">No posts yet — waiting on connection.</div>
    </div>

    <!-- STATS -->
    <div class="section-head" style="margin-top:44px;">
      <div>
        <span class="eyebrow">Who's been busy</span>
        <h2>Top authors</h2>
      </div>
    </div>
    <div id="stats-wrap">
      <div class="empty">No data yet.</div>
    </div>

  </div>

  <div class="side">
    <h3 class="side-title">✎ Behind the scenes</h3>
    <div class="console">
      <div class="console-head">
        <span id="console-count">0 requests</span>
        <button id="clear-console">clear</button>
      </div>
      <div class="console-log" id="console-log">
        <div class="console-empty">Requests will appear here as you use the app.</div>
      </div>
    </div>

    <h3 class="side-title">People</h3>
    <div class="form-card">
      <div class="row">
        <div class="field"><label>Name</label><input id="new-user-name" placeholder="Ada"></div>
      </div>
      <div class="field" style="margin-bottom:12px;"><label>Email</label><input id="new-user-email" placeholder="ada@example.com"></div>
      <div class="form-error" id="new-user-error"></div>
      <div class="form-actions">
        <button class="solid-btn" id="submit-user-btn" style="width:100%;">+ Add person</button>
      </div>
    </div>
    <div id="user-list"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <span class="eyebrow" style="display:block;">Reading</span>
      <h2 id="drawer-title" style="font-size:21px; margin-top:4px;">—</h2>
    </div>
    <button class="x" id="drawer-close">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  let API_BASE = document.getElementById('base-url-input').value.replace(/\/$/, '');
  let users = [];
  let posts = [];
  let requestCount = 0;

  const $ = (id) => document.getElementById(id);
  const consoleLog = $('console-log');
  const statusDot = $('status-dot');

  function toast(msg, isErr){
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove('show'), 2600);
  }

  function logRequest(method, path, status, ms, ok){
    if (consoleLog.querySelector('.console-empty')) consoleLog.innerHTML = '';
    requestCount++;
    $('console-count').textContent = requestCount + ' request' + (requestCount===1?'':'s');
    const row = document.createElement('div');
    row.className = 'log-row';
    const time = new Date().toLocaleTimeString('en-US', {hour12:false});
    row.innerHTML = `
      <span class="t">${time}</span>
      <span class="m ${method}">${method}</span>
      <span class="p">${path}</span>
      <span class="s ${ok ? 'ok':'err'}">${status}</span>
      <span class="ms">${ms}ms</span>
    `;
    consoleLog.prepend(row);
  }

  async function api(method, path, body){
    const start = performance.now();
    let res, data, ok, status;
    try{
      res = await fetch(API_BASE + path, {
        method,
        headers: body ? {'Content-Type':'application/json'} : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      status = res.status;
      ok = res.ok;
      const text = await res.text();
      try{ data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
    } catch(err){
      status = 'ERR';
      ok = false;
      data = { error: err.message };
    }
    const ms = Math.round(performance.now() - start);
    logRequest(method, path, status, ms, ok);
    if (!ok) throw Object.assign(new Error((data && data.error) || 'Request failed'), {data, status});
    return data;
  }

  $('clear-console').onclick = () => {
    requestCount = 0;
    $('console-count').textContent = '0 requests';
    consoleLog.innerHTML = '<div class="console-empty">Requests will appear here as you use the app.</div>';
  };

  function setStatus(state){
    statusDot.className = 'status-dot ' + state;
    $('status-label').textContent = state === 'live' ? 'connected' : state === 'down' ? 'unreachable' : 'connecting…';
  }

  async function checkConnection(){
    setStatus('pending');
    try{
      await api('GET', '/users');
      setStatus('live');
      return true;
    } catch(e){
      setStatus('down');
      return false;
    }
  }

  function timeAgo(iso){
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff/60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m/60);
    if (h < 24) return h + 'h ago';
    return Math.floor(h/24) + 'd ago';
  }

  function renderUserSelects(){
    const opts = '<option value="">— select someone —</option>' + users.map(u => `<option value="${u._id}">${escapeHtml(u.name)}</option>`).join('');
    $('new-post-author').innerHTML = opts;
  }

  function renderUserList(){
    const wrap = $('user-list');
    if (!users.length){ wrap.innerHTML = '<div class="empty" style="margin-top:12px;">No one yet.</div>'; return; }
    wrap.innerHTML = users.map(u => `
      <div class="user-row">
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="user-avatar">${escapeHtml((u.name||'?').charAt(0).toUpperCase())}</div>
          <div>
            <div style="font-size:13.5px; font-weight:600;">${escapeHtml(u.name)}</div>
            <div style="font-size:11.5px; color:var(--text-dim);">${escapeHtml(u.email)}</div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderPosts(){
    $('post-count').textContent = posts.length + ' total';
    const list = $('post-list');
    if (!posts.length){
      list.innerHTML = '<div class="empty">No posts yet — write the first one.</div>';
      return;
    }
    list.innerHTML = posts.map((p, i) => `
      <div class="post-card" data-id="${p._id}">
        <span class="idx">#${String(i+1).padStart(2,'0')}</span>
        <h3>${escapeHtml(p.title)}</h3>
        <div class="meta">
          <span>by <b>${escapeHtml(p.author && p.author.name || 'unknown')}</b></span>
          <span>·</span>
          <span>${timeAgo(p.createdAt)}</span>
          ${p.tags && p.tags.length ? '<span>·</span>' + p.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('') : ''}
        </div>
        <div class="excerpt">${escapeHtml((p.body||'').slice(0,140))}${p.body && p.body.length > 140 ? '…' : ''}</div>
      </div>
    `).join('');
    list.querySelectorAll('.post-card').forEach(card => {
      card.onclick = () => openPost(card.dataset.id);
    });
  }

  async function loadUsers(){
    try{
      users = await api('GET', '/users');
      renderUserSelects();
      renderUserList();
    } catch(e){ /* handled by connection status */ }
  }

  async function loadPosts(){
    try{
      posts = await api('GET', '/posts');
      renderPosts();
    } catch(e){
      $('post-list').innerHTML = '<div class="empty">Could not load posts. Check the API address above.</div>';
    }
  }

  async function loadStats(){
    try{
      const stats = await api('GET', '/stats/top-authors');
      const wrap = $('stats-wrap');
      if (!stats.length){ wrap.innerHTML = '<div class="empty">No data yet.</div>'; return; }
      const max = Math.max(...stats.map(s => s.postCount));
      wrap.innerHTML = `
        <table class="stats-table">
          <thead><tr><th>#</th><th>Author</th><th>Posts</th></tr></thead>
          <tbody>
            ${stats.map((s,i) => `
              <tr>
                <td class="rank">${String(i+1).padStart(2,'0')}</td>
                <td>
                  ${escapeHtml(s.name)}
                  <div class="bar-wrap"><div class="bar" style="width:${(s.postCount/max*100)}%"></div></div>
                </td>
                <td class="mono">${s.postCount}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch(e){
      $('stats-wrap').innerHTML = '<div class="empty">Stats unavailable.</div>';
    }
  }

  async function refreshAll(){
    const connected = await checkConnection();
    if (!connected){
      $('post-list').innerHTML = `<div class="empty">Can't reach the API. Check the address above and hit Connect.</div>`;
      $('stats-wrap').innerHTML = '<div class="empty">—</div>';
      return;
    }
    await Promise.all([loadUsers(), loadPosts(), loadStats()]);
  }

  // --- New post form ---
  $('new-post-btn').onclick = () => {
    $('new-post-form').style.display = 'block';
    $('new-post-btn').style.display = 'none';
  };
  $('cancel-post-btn').onclick = () => {
    $('new-post-form').style.display = 'none';
    $('new-post-btn').style.display = 'inline-block';
    $('new-post-error').textContent = '';
  };
  $('submit-post-btn').onclick = async () => {
    const title = $('new-post-title').value.trim();
    const body = $('new-post-body').value.trim();
    const author = $('new-post-author').value;
    const tags = $('new-post-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    $('new-post-error').textContent = '';
    if (!title || !body || !author){
      $('new-post-error').textContent = 'Title, body and author are required.';
      return;
    }
    try{
      await api('POST', '/posts', { title, body, author, tags });
      $('new-post-title').value = '';
      $('new-post-body').value = '';
      $('new-post-tags').value = '';
      $('cancel-post-btn').click();
      toast('Post published 🌿');
      await loadPosts();
      await loadStats();
    } catch(e){
      $('new-post-error').textContent = e.message;
    }
  };

  // --- New user form ---
  $('submit-user-btn').onclick = async () => {
    const name = $('new-user-name').value.trim();
    const email = $('new-user-email').value.trim();
    $('new-user-error').textContent = '';
    if (!name || !email){
      $('new-user-error').textContent = 'Name and email are required.';
      return;
    }
    try{
      await api('POST', '/users', { name, email });
      $('new-user-name').value = '';
      $('new-user-email').value = '';
      toast('Person added');
      await loadUsers();
    } catch(e){
      $('new-user-error').textContent = e.message;
    }
  };

  // --- Post detail drawer ---
  async function openPost(id){
    const post = posts.find(p => p._id === id);
    if (!post) return;
    $('drawer-title').textContent = post.title;
    $('drawer').classList.add('open');
    $('overlay').classList.add('open');
    $('drawer-body').innerHTML = `
      <div style="margin-bottom:16px; font-size:12.5px; color:var(--text-muted);">
        by <b style="color:var(--text);">${escapeHtml(post.author && post.author.name || 'unknown')}</b> · ${timeAgo(post.createdAt)}
      </div>
      <p>${escapeHtml(post.body)}</p>
      <h3 style="font-size:13px; color:var(--sage-deep); margin:28px 0 6px;">Comments</h3>
      <div id="comment-list"><div class="empty" style="margin-top:10px;">Loading…</div></div>
      <div class="form-card" style="margin-top:18px;">
        <div class="row">
          <div class="field">
            <label>Comment as</label>
            <select id="new-comment-author"><option value="">— select someone —</option>${users.map(u => `<option value="${u._id}">${escapeHtml(u.name)}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field" style="margin-bottom:12px;"><label>Comment</label><textarea id="new-comment-text" placeholder="Add a comment…" style="min-height:54px;"></textarea></div>
        <div class="form-error" id="new-comment-error"></div>
        <div class="form-actions">
          <button class="solid-btn" id="submit-comment-btn">Add comment</button>
        </div>
      </div>
    `;
    $('submit-comment-btn').onclick = async () => {
      const author = $('new-comment-author').value;
      const text = $('new-comment-text').value.trim();
      $('new-comment-error').textContent = '';
      if (!author || !text){
        $('new-comment-error').textContent = 'Pick a person and write a comment.';
        return;
      }
      try{
        await api('POST', `/posts/${id}/comments`, { author, text });
        $('new-comment-text').value = '';
        toast('Comment added');
        loadComments(id);
      } catch(e){
        $('new-comment-error').textContent = e.message;
      }
    };
    loadComments(id);
  }

  async function loadComments(postId){
    try{
      const comments = await api('GET', `/posts/${postId}/comments`);
      const list = $('comment-list');
      if (!comments.length){
        list.innerHTML = '<div class="empty" style="margin-top:10px;">No comments yet.</div>';
        return;
      }
      list.innerHTML = comments.map(c => `
        <div class="comment">
          <div class="who">${escapeHtml(c.author && c.author.name || 'unknown')} · ${timeAgo(c.createdAt)}</div>
          <div class="txt">${escapeHtml(c.text)}</div>
        </div>
      `).join('');
    } catch(e){
      $('comment-list').innerHTML = '<div class="empty" style="margin-top:10px;">Could not load comments.</div>';
    }
  }

  function closeDrawer(){
    $('drawer').classList.remove('open');
    $('overlay').classList.remove('open');
  }
  $('drawer-close').onclick = closeDrawer;
  $('overlay').onclick = closeDrawer;

  // --- Connect button ---
  $('connect-btn').onclick = () => {
    API_BASE = $('base-url-input').value.trim().replace(/\/$/, '');
    refreshAll();
  };
  $('base-url-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('connect-btn').click();
  });

  refreshAll();
})();
</script>
</body>
</html>
