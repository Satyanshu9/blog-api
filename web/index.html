<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Nook — a cozy blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF4EA;
    --surface: #FFFCF7;
    --surface-soft: #FFF6EB;
    --line: #EDE0CE;
    --line-soft: #F2E8D8;
    --text: #4B3F33;
    --text-muted: #92806D;
    --text-dim: #BFAE99;
    --sage: #7C9683;
    --sage-deep: #5F7A67;
    --rose: #D98F92;
    --rose-deep: #C06E72;
    --honey: #E3A94E;
    --shadow-sm: 0 2px 10px rgba(90, 68, 40, 0.06);
    --shadow-md: 0 10px 30px rgba(90, 68, 40, 0.10);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background:
      radial-gradient(600px 380px at 8% 0%, rgba(216,175,124,0.16), transparent 60%),
      radial-gradient(700px 420px at 100% 12%, rgba(124,150,131,0.14), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }

  h1,h2,h3{ font-family:'Fraunces', serif; margin:0; letter-spacing:-0.01em; color: var(--text); }
  .mono{ font-family:'JetBrains Mono', monospace; }

  button, input, textarea, select{ font-family: inherit; }
  ::selection{ background: var(--honey); color: #3A2A10; }
  :focus-visible{ outline: 2px solid var(--sage-deep); outline-offset: 2px; border-radius: 4px; }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index: 20;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding: 16px 30px;
    background: rgba(251,244,234,0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .leaf{
    width:32px; height:32px; border-radius:50%;
    background: linear-gradient(160deg, var(--sage), var(--sage-deep));
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
    box-shadow: var(--shadow-sm);
  }
  .brand h1{ font-size: 21px; font-weight:600; }
  .brand .tag{ font-size:11px; color:var(--text-dim); margin-left:2px; font-family:'Nunito'; }

  /* ---------- Layout ---------- */
  .layout{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: 1fr 330px;
    max-width: 1280px;
    margin: 0 auto;
    min-height: calc(100vh - 66px);
    gap: 0;
  }
  .main{ padding: 34px 32px 90px; min-width:0; }
  .side{ padding: 34px 26px 90px; }

  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; gap:12px; flex-wrap:wrap;
  }
  .section-head .eyebrow{
    font-size:12px; letter-spacing:0.04em; color:var(--sage-deep); display:block; margin-bottom:4px; font-weight:700;
  }
  .section-head h2{ font-size:28px; }
  .section-head .count{ color:var(--text-dim); font-size:12.5px; }

  .head-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .sort-select{
    background: var(--surface); border:1px solid var(--line); color:var(--text-muted);
    font-size:12.5px; font-weight:600; padding:8px 12px; border-radius: 999px; cursor:pointer;
    box-shadow: var(--shadow-sm);
  }

  .ghost-btn{
    background: var(--surface); border:1px solid var(--line); color:var(--text-muted);
    font-size:13px; padding:8px 15px; border-radius: 999px; cursor:pointer;
    transition: all .15s; font-weight:600;
  }
  .ghost-btn:hover{ border-color: var(--rose); color: var(--rose-deep); }
  .solid-btn{
    background: var(--sage); border:none; color:#fff;
    font-weight:700; font-size:13px; padding:9px 18px; border-radius: 999px; cursor:pointer;
    transition: all .15s; box-shadow: var(--shadow-sm);
  }
  .solid-btn:hover{ background: var(--sage-deep); transform: translateY(-1px); }
  .solid-btn:disabled, .ghost-btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

  /* ---------- Post cards ---------- */
  .post-list{ display:flex; flex-direction:column; gap:14px; }
  .post-card{
    background: var(--surface);
    border:1px solid var(--line-soft);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .18s, transform .12s;
  }
  .post-card:hover{ box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .post-card:active{ transform: translateY(0); }
  .post-card .idx{
    font-family:'JetBrains Mono', monospace; color:var(--text-dim); font-size:11px;
  }
  .post-card h3{ font-size:19px; margin:6px 0 8px; font-weight:600; }
  .post-card .meta{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    font-size:12.5px; color:var(--text-muted); margin-bottom:10px;
  }
  .post-card .meta b{ color:var(--text); font-weight:700; }
  .post-card .excerpt{ font-size:14px; color:var(--text-muted); line-height:1.65; }
  .tag-pill{
    font-size:11px; color:var(--rose-deep); font-weight:700;
    background: rgba(217,143,146,0.14); border:1px solid rgba(217,143,146,0.28);
    padding:3px 10px; border-radius:20px;
  }

  .empty{
    border:1.5px dashed var(--line); border-radius: var(--radius-md);
    padding: 32px 18px; text-align:center; color:var(--text-dim); font-size:13.5px;
    background: var(--surface-soft);
  }

  /* ---------- Forms ---------- */
  .form-card{
    background: var(--surface); border:1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 18px; margin-bottom: 24px; box-shadow: var(--shadow-sm);
  }
  .field label{
    display:block; font-size:11.5px; font-weight:700;
    color: var(--text-muted); margin-bottom:6px;
  }
  .field input, .field textarea, .field select{
    width:100%; background: var(--surface-soft); border:1.5px solid var(--line); color:var(--text);
    border-radius: var(--radius-sm); padding:9px 12px; font-size:13.5px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color: var(--sage); }
  .field textarea{ resize:vertical; min-height:76px; font-family:inherit; }
  .field{ margin-bottom:12px; }
  .field:last-of-type{ margin-bottom: 0; }
  .form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .form-error{ color:var(--rose-deep); font-size:12.5px; margin-top:8px; font-weight:600; }

  .locked-note{
    font-size:12.5px; color:var(--text-dim); background: var(--surface-soft);
    border:1px dashed var(--line); border-radius: var(--radius-md); padding:12px 14px; margin-bottom:16px;
  }
  .locked-note button{ background:none; border:none; color:var(--sage-deep); font-weight:700; cursor:pointer; padding:0; font-size:inherit; text-decoration:underline; }

  /* ---------- Modals (auth + reading) ---------- */
  .modal-overlay{
    position: fixed; inset:0; background: rgba(74,60,42,0.32);
    z-index: 40; display:none; align-items:center; justify-content:center;
    backdrop-filter: blur(3px); padding: 20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background: var(--bg); border:1px solid var(--line); border-radius: var(--radius-lg);
    width: 100%; max-width: 380px; box-shadow: var(--shadow-md);
    padding: 26px 26px 22px;
  }
  .modal-box h2{ font-size:22px; margin-bottom:4px; }
  .modal-sub{ font-size:12.5px; color:var(--text-muted); margin-bottom:18px; }
  .modal-close{
    float:right; background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer;
  }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:18px; background: var(--surface-soft); padding:4px; border-radius:999px; }
  .auth-tab{
    flex:1; text-align:center; padding:7px 0; border-radius:999px; font-size:12.5px; font-weight:700;
    color: var(--text-muted); cursor:pointer; transition: all .15s;
  }
  .auth-tab.active{ background: var(--sage); color:#fff; }
  .auth-panel{ display:none; }
  .auth-panel.active{ display:block; }

  .read-box{
    background: var(--bg); border:1px solid var(--line); border-radius: var(--radius-lg);
    width: 100%; max-width: 740px; max-height: 88vh; box-shadow: var(--shadow-md);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .read-head{
    padding: 22px 30px; border-bottom:1px solid var(--line); flex-shrink:0;
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
    background: var(--surface);
  }
  .read-head h2{ font-size:24px; line-height:1.3; }
  .read-body{ padding: 26px 30px 34px; overflow-y:auto; }
  .read-body .byline{ font-size:12.5px; color:var(--text-muted); margin-bottom:18px; }
  .read-body .byline b{ color:var(--text); }
  .read-body p.content{ line-height:1.85; font-size:15.5px; color: var(--text-muted); white-space:pre-wrap; }
  .read-body .tags-row{ margin-top:16px; display:flex; gap:6px; flex-wrap:wrap; }

  .comment{ border-bottom:1px solid var(--line-soft); padding: 14px 0; }
  .comment .who{ font-size:12.5px; color:var(--sage-deep); font-weight:700; margin-bottom:4px; }
  .comment .txt{ font-size:14px; color:var(--text); line-height:1.6; }

  /* ---------- Stats ---------- */
  .stats-table{ width:100%; border-collapse: collapse; margin-top:12px; }
  .stats-table th{
    text-align:left; font-size:11px; font-weight:700;
    color:var(--text-dim); padding: 6px 10px; border-bottom:1px solid var(--line);
  }
  .stats-table td{ padding: 11px 10px; border-bottom:1px solid var(--line-soft); font-size:13.5px; }
  .stats-table tr:last-child td{ border-bottom:none; }
  .rank{ font-family:'JetBrains Mono',monospace; color: var(--rose-deep); font-size:12px; font-weight:700; }
  .bar-wrap{ background: var(--surface-soft); border-radius:6px; height:6px; margin-top:5px; overflow:hidden; }
  .bar{ height:100%; background: linear-gradient(90deg, var(--sage), var(--honey)); border-radius:6px; }

  .side-title{
    font-size:15px; color:var(--text); font-weight:600;
    margin-bottom:4px; font-family:'Fraunces', serif;
  }
  .side .eyebrow{
    font-size:12px; letter-spacing:0.04em; color:var(--sage-deep); display:block; margin-bottom:4px; font-weight:700;
  }
  .side-card{
    background: var(--surface); border:1px solid var(--line-soft); border-radius: var(--radius-lg);
    padding: 18px; box-shadow: var(--shadow-sm);
  }

  .toast{
    position: fixed; bottom:24px; left:50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 12px 20px; border-radius: 999px; font-size:13.5px; font-weight:600; z-index:50;
    opacity:0; transition: all .25s; pointer-events:none; box-shadow: var(--shadow-md);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
  .toast.err{ background: var(--rose-deep); }

  /* ---------- Profile (navbar) ---------- */
  .profile-wrap{ position:relative; }
  .profile-chip{
    display:flex; align-items:center; gap:8px;
    background: var(--surface); border:1px solid var(--line); border-radius: 999px;
    padding: 5px 14px 5px 6px; cursor:pointer; box-shadow: var(--shadow-sm);
    transition: box-shadow .15s;
  }
  .profile-chip:hover{ box-shadow: var(--shadow-md); }
  .avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    background: linear-gradient(160deg, var(--rose), var(--honey));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:11.5px; font-family:'Fraunces';
  }
  .profile-chip span{ font-size:12.5px; font-weight:700; color:var(--text); }
  .profile-chip svg{ opacity:.5; }

  .profile-menu{
    position:absolute; top: calc(100% + 10px); right:0; width:260px;
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md); padding: 16px; z-index:35; display:none;
  }
  .profile-menu.open{ display:block; }
  .profile-menu .who-name{ font-size:16px; font-weight:600; font-family:'Fraunces'; }
  .profile-menu .who-email{ font-size:12px; color:var(--text-dim); margin-bottom:12px; }
  .menu-divider{ border:none; border-top:1px solid var(--line-soft); margin: 10px 0; }
  .menu-item{
    font-size:13px; font-weight:600; color:var(--text-muted); padding:8px 6px; border-radius:8px;
    cursor:pointer; transition: background .12s;
  }
  .menu-item:hover{ background: var(--surface-soft); color:var(--text); }
  .menu-item.danger{ color: var(--rose-deep); }
  .menu-sub{ display:none; padding: 8px 6px 2px; }
  .menu-sub.open{ display:block; }
  .menu-sub .field{ margin-bottom:8px; }
  .menu-sub .field input{ font-size:12.5px; padding:7px 10px; }
  .menu-sub button{ width:100%; margin-top:2px; }
  .menu-error{ color:var(--rose-deep); font-size:11.5px; margin-top:4px; font-weight:600; }

  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; }
    .main{ border-bottom:1px solid var(--line); }
    .read-box{ max-width: 100%; max-height: 100vh; height:100vh; border-radius:0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="leaf">🌿</div>
    <h1>The Nook</h1>
    <span class="tag">a cozy little blog</span>
  </div>
  <div id="account-area"></div>
</div>

<div class="layout">
  <div class="main">

    <!-- POSTS -->
    <div class="section-head">
      <div>
        <span class="eyebrow">From the notebook</span>
        <h2>Posts</h2>
      </div>
      <div class="head-controls">
        <span class="count" id="post-count">0 total</span>
        <select class="sort-select" id="sort-select">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="author">By author (A–Z)</option>
        </select>
        <button class="solid-btn" id="new-post-btn">+ Write a post</button>
      </div>
    </div>

    <div class="form-card" id="new-post-form" style="display:none;">
      <div class="field"><label>Title</label><input id="new-post-title" placeholder="On calibration drift"></div>
      <div class="field"><label>Body</label><textarea id="new-post-body" placeholder="Write the post…"></textarea></div>
      <div class="field"><label>Tags (comma separated)</label><input id="new-post-tags" placeholder="intro, notes"></div>
      <div class="field">
        <label>Photo (optional)</label>
        <input type="file" id="new-post-image" accept="image/*">
        <img id="new-post-preview" style="display:none; max-width:100%; border-radius:12px; margin-top:10px;">
      </div>
      <div style="font-size:12px; color:var(--text-dim);">Posting as <b id="posting-as-name" style="color:var(--sage-deep);"></b></div>
      <div class="form-error" id="new-post-error"></div>
      <div class="form-actions">
        <button class="ghost-btn" id="cancel-post-btn">Cancel</button>
        <button class="solid-btn" id="submit-post-btn">Publish</button>
      </div>
    </div>

    <div class="post-list" id="post-list">
      <div class="empty">Loading posts…</div>
    </div>

    <div id="pagination" style="display:none; justify-content:center; align-items:center; gap:16px; margin-top:26px;">
      <button class="ghost-btn" id="prev-page-btn">← Previous</button>
      <span id="page-indicator" style="font-size:12.5px; color:var(--text-dim); font-weight:600;"></span>
      <button class="ghost-btn" id="next-page-btn">Next →</button>
    </div>

  </div>

  <div class="side">
    <span class="eyebrow">Who's been busy</span>
    <h2 class="side-title" style="font-size:22px; margin-bottom:14px;">Top authors</h2>
    <div class="side-card">
      <div id="stats-wrap"><div class="empty">No data yet.</div></div>
    </div>
  </div>
</div>

<!-- Auth modal -->
<div class="modal-overlay" id="auth-overlay">
  <div class="modal-box">
    <button class="modal-close" id="auth-modal-close">&times;</button>
    <h2>Welcome</h2>
    <div class="modal-sub">Log in or create an account to write.</div>
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login">Log in</div>
      <div class="auth-tab" data-tab="register">Sign up</div>
    </div>

    <div class="auth-panel active" id="login-panel">
      <form id="login-form" autocomplete="on">
        <div class="field"><label>Email</label><input id="login-email" type="email" name="email" autocomplete="username" placeholder="ada@example.com"></div>
        <div class="field"><label>Password</label><input id="login-password" type="password" name="password" autocomplete="current-password" placeholder="••••••••"></div>
        <div class="form-error" id="login-error"></div>
        <button class="solid-btn" type="submit" style="width:100%; margin-top:6px;">Log in</button>
      </form>
    </div>

    <div class="auth-panel" id="register-panel">
      <form id="register-form" autocomplete="on">
        <div class="field"><label>Name</label><input id="register-name" name="name" autocomplete="name" placeholder="Ada"></div>
        <div class="field"><label>Email</label><input id="register-email" type="email" name="email" autocomplete="username" placeholder="ada@example.com"></div>
        <div class="field"><label>Password</label><input id="register-password" type="password" name="new-password" autocomplete="new-password" placeholder="At least 6 characters"></div>
        <div class="form-error" id="register-error"></div>
        <button class="solid-btn" type="submit" style="width:100%; margin-top:6px;">Create account</button>
      </form>
    </div>
  </div>
</div>

<!-- Full-screen post reading modal -->
<div class="modal-overlay" id="read-overlay">
  <div class="read-box">
    <div class="read-head">
      <h2 id="read-title">—</h2>
      <button class="modal-close" id="read-close" style="flex-shrink:0;">&times;</button>
    </div>
    <div class="read-body" id="read-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const API_BASE = (params.get('api') || 'https://blog-api-70xt.onrender.com').replace(/\/$/, '');

  let posts = [];
  let token = null;
  let currentUser = null;

  const $ = (id) => document.getElementById(id);

  // ---------- persistence ----------
  function saveSession(){
    try{
      localStorage.setItem('nook_token', token || '');
      localStorage.setItem('nook_user', JSON.stringify(currentUser || null));
    } catch(e){ /* storage unavailable — session just won't survive reload */ }
  }
  function loadSession(){
    try{
      const t = localStorage.getItem('nook_token');
      const u = localStorage.getItem('nook_user');
      if (t && u){ token = t; currentUser = JSON.parse(u); }
    } catch(e){ /* ignore */ }
  }
  function clearSession(){
    try{
      localStorage.removeItem('nook_token');
      localStorage.removeItem('nook_user');
    } catch(e){ /* ignore */ }
  }

  function toast(msg, isErr){
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove('show'), 2600);
  }

  async function api(method, path, body){
    const headers = {};
    if (body) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;
    let res, data;
    try{
      res = await fetch(API_BASE + path, {
        method,
        headers: Object.keys(headers).length ? headers : undefined,
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await res.text();
      try{ data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
    } catch(err){
      throw Object.assign(new Error('Could not reach the server'), { status: 'ERR' });
    }
    if (!res.ok){
      if (res.status === 401 && token){
        token = null; currentUser = null; clearSession(); renderAccountArea();
      }
      throw Object.assign(new Error((data && data.error) || 'Request failed'), { data, status: res.status });
    }
    return data;
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function timeAgo(iso){
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff/60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m/60);
    if (h < 24) return h + 'h ago';
    return Math.floor(h/24) + 'd ago';
  }

  // ---------- account / profile UI ----------
  function renderAccountArea(){
    const area = $('account-area');
    if (currentUser){
      area.innerHTML = `
        <div class="profile-wrap">
          <div class="profile-chip" id="profile-chip-btn">
            <div class="avatar">${escapeHtml(currentUser.name.charAt(0).toUpperCase())}</div>
            <span>${escapeHtml(currentUser.name)}</span>
            <svg width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="#92806D" stroke-width="1.5" fill="none"/></svg>
          </div>
          <div class="profile-menu" id="profile-menu">
            <div class="who-name">${escapeHtml(currentUser.name)}</div>
            <div class="who-email">${escapeHtml(currentUser.email)}</div>
            <hr class="menu-divider">
            <div class="menu-item" id="toggle-edit-name">Edit name</div>
            <div class="menu-sub" id="edit-name-box">
              <div class="field"><input id="edit-name-input" value="${escapeHtml(currentUser.name)}"></div>
              <button class="solid-btn" id="save-name-btn" type="button">Save name</button>
              <div class="menu-error" id="edit-name-error"></div>
            </div>
            <div class="menu-item" id="toggle-change-pw">Change password</div>
            <div class="menu-sub" id="change-pw-box">
              <div class="field"><input id="current-pw-input" type="password" placeholder="Current password" autocomplete="current-password"></div>
              <div class="field"><input id="new-pw-input" type="password" placeholder="New password" autocomplete="new-password"></div>
              <button class="solid-btn" id="save-pw-btn" type="button">Update password</button>
              <div class="menu-error" id="change-pw-error"></div>
            </div>
            <hr class="menu-divider">
            <div class="menu-item danger" id="logout-item">Log out</div>
          </div>
        </div>
      `;
      $('profile-chip-btn').onclick = (e) => {
        e.stopPropagation();
        $('profile-menu').classList.toggle('open');
      };
      $('toggle-edit-name').onclick = () => {
        $('edit-name-box').classList.toggle('open');
        $('change-pw-box').classList.remove('open');
      };
      $('toggle-change-pw').onclick = () => {
        $('change-pw-box').classList.toggle('open');
        $('edit-name-box').classList.remove('open');
      };
      $('save-name-btn').onclick = saveNameChange;
      $('save-pw-btn').onclick = savePasswordChange;
      $('logout-item').onclick = logout;
    } else {
      area.innerHTML = `<button class="solid-btn" id="account-login-btn">Log in</button>`;
      $('account-login-btn').onclick = openAuthModal;
    }
    renderPostingGate();
  }

  document.addEventListener('click', (e) => {
    const menu = $('profile-menu');
    const chip = $('profile-chip-btn');
    if (menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target !== chip){
      menu.classList.remove('open');
    }
  });

  async function saveNameChange(){
    const name = $('edit-name-input').value.trim();
    $('edit-name-error').textContent = '';
    if (!name){ $('edit-name-error').textContent = 'Name cannot be empty.'; return; }
    try{
      const user = await api('PUT', '/users/me', { name });
      currentUser = { ...currentUser, name: user.name };
      saveSession();
      renderAccountArea();
      toast('Name updated');
      await loadPosts();
    } catch(e){
      $('edit-name-error').textContent = e.message;
    }
  }

  async function savePasswordChange(){
    const currentPassword = $('current-pw-input').value;
    const newPassword = $('new-pw-input').value;
    $('change-pw-error').textContent = '';
    if (!currentPassword || !newPassword){
      $('change-pw-error').textContent = 'Both fields are required.';
      return;
    }
    try{
      await api('PUT', '/users/me/password', { currentPassword, newPassword });
      $('current-pw-input').value = '';
      $('new-pw-input').value = '';
      $('change-pw-box').classList.remove('open');
      toast('Password updated');
    } catch(e){
      $('change-pw-error').textContent = e.message;
    }
  }

  function renderPostingGate(){
    const btn = $('new-post-btn');
    if (currentUser){
      btn.disabled = false;
      btn.title = '';
      const nameEl = $('posting-as-name');
      if (nameEl) nameEl.textContent = currentUser.name;
    } else {
      btn.disabled = true;
      btn.title = 'Log in to write a post';
    }
  }

  function openAuthModal(){ $('auth-overlay').classList.add('open'); }
  function closeAuthModal(){
    $('auth-overlay').classList.remove('open');
    $('login-error').textContent = '';
    $('register-error').textContent = '';
  }

  async function login(){
    const email = $('login-email').value.trim();
    const password = $('login-password').value;
    $('login-error').textContent = '';
    if (!email || !password){
      $('login-error').textContent = 'Email and password are required.';
      return;
    }
    try{
      const data = await api('POST', '/users/login', { email, password });
      token = data.token;
      currentUser = data.user;
      saveSession();
      closeAuthModal();
      $('login-form').reset();
      toast(`Welcome back, ${currentUser.name} 🌿`);
      renderAccountArea();
      await loadPosts();
    } catch(e){
      $('login-error').textContent = e.message;
    }
  }

  async function register(){
    const name = $('register-name').value.trim();
    const email = $('register-email').value.trim();
    const password = $('register-password').value;
    $('register-error').textContent = '';
    if (!name || !email || !password){
      $('register-error').textContent = 'All fields are required.';
      return;
    }
    if (password.length < 6){
      $('register-error').textContent = 'Password should be at least 6 characters.';
      return;
    }
    try{
      await api('POST', '/users/register', { name, email, password });
      const data = await api('POST', '/users/login', { email, password });
      token = data.token;
      currentUser = data.user;
      saveSession();
      closeAuthModal();
      $('register-form').reset();
      toast(`Welcome, ${currentUser.name} 🌿`);
      renderAccountArea();
      await loadPosts();
    } catch(e){
      $('register-error').textContent = e.message;
    }
  }

  function logout(){
    token = null;
    currentUser = null;
    clearSession();
    renderAccountArea();
    toast('Logged out');
  }

  // ---------- posts ----------
  let currentPage = 1;
  let totalPages = 1;
  let totalCount = 0;

  function renderPosts(){
    $('post-count').textContent = totalCount + ' total';
    const list = $('post-list');
    if (!posts.length){
      list.innerHTML = '<div class="empty">No posts yet — write the first one.</div>';
      $('pagination').style.display = 'none';
      return;
    }
    const startIdx = (currentPage - 1) * 10;
    list.innerHTML = posts.map((p, i) => `
      <div class="post-card" data-id="${p._id}">
        <span class="idx">#${String(startIdx + i + 1).padStart(2,'0')}</span>
        ${p.imageThumbUrl ? `
          <div style="width:100%; max-height:280px; overflow:hidden; border-radius:14px; margin:10px 0; background:var(--surface-soft); display:flex; align-items:center; justify-content:center;">
            <img src="${p.imageThumbUrl}" style="width:100%; height:100%; object-fit:contain;" loading="lazy">
          </div>
        ` : ''}
        <h3>${escapeHtml(p.title)}</h3>
        <div class="meta">
          <span>by <b>${escapeHtml(p.author && p.author.name || 'unknown')}</b></span>
          <span>·</span>
          <span>${timeAgo(p.createdAt)}</span>
          ${p.tags && p.tags.length ? '<span>·</span>' + p.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('') : ''}
        </div>
        <div class="excerpt">${escapeHtml((p.body||'').slice(0,160))}${p.body && p.body.length > 160 ? '…' : ''}</div>
      </div>
    `).join('');
    list.querySelectorAll('.post-card').forEach(card => {
      card.onclick = () => openPost(card.dataset.id);
    });
    renderPagination();
  }

  function renderPagination(){
    const pag = $('pagination');
    if (totalPages <= 1){ pag.style.display = 'none'; return; }
    pag.style.display = 'flex';
    $('page-indicator').textContent = `Page ${currentPage} of ${totalPages}`;
    $('prev-page-btn').disabled = currentPage <= 1;
    $('next-page-btn').disabled = currentPage >= totalPages;
  }

  $('sort-select').onchange = () => loadPosts(1);
  $('prev-page-btn').onclick = () => { if (currentPage > 1) loadPosts(currentPage - 1); };
  $('next-page-btn').onclick = () => { if (currentPage < totalPages) loadPosts(currentPage + 1); };

  async function loadPosts(page){
    page = page || currentPage;
    const sort = $('sort-select').value;
    try{
      const data = await api('GET', `/posts?page=${page}&sort=${sort}`);
      posts = data.posts;
      currentPage = data.page;
      totalPages = data.totalPages;
      totalCount = data.totalCount;
      renderPosts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch(e){
      $('post-list').innerHTML = '<div class="empty">Could not load posts. The server may be waking up — try again in a moment.</div>';
    }
  }

  async function loadStats(){
    try{
      const stats = await api('GET', '/stats/top-authors');
      const wrap = $('stats-wrap');
      if (!stats.length){ wrap.innerHTML = '<div class="empty">No data yet.</div>'; return; }
      const max = Math.max(...stats.map(s => s.postCount));
      wrap.innerHTML = `
        <table class="stats-table">
          <thead><tr><th>#</th><th>Author</th><th>Posts</th></tr></thead>
          <tbody>
            ${stats.map((s,i) => `
              <tr>
                <td class="rank">${String(i+1).padStart(2,'0')}</td>
                <td>
                  ${escapeHtml(s.name)}
                  <div class="bar-wrap"><div class="bar" style="width:${(s.postCount/max*100)}%"></div></div>
                </td>
                <td class="mono">${s.postCount}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch(e){
      $('stats-wrap').innerHTML = '<div class="empty">Stats unavailable.</div>';
    }
  }

  // ---------- new post form ----------
  $('new-post-btn').onclick = () => {
    if (!currentUser){ openAuthModal(); return; }
    $('new-post-form').style.display = 'block';
    $('new-post-btn').style.display = 'none';
  };
  $('cancel-post-btn').onclick = () => {
    $('new-post-form').style.display = 'none';
    $('new-post-btn').style.display = 'inline-block';
    $('new-post-error').textContent = '';
  };
  $('new-post-image').addEventListener('change', (e) => {
    const file = e.target.files[0];
    const preview = $('new-post-preview');
    if (file){
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    } else {
      preview.style.display = 'none';
    }
  });
  $('submit-post-btn').onclick = async () => {
    const title = $('new-post-title').value.trim();
    const body = $('new-post-body').value.trim();
    const tags = $('new-post-tags').value.trim();
    const imageFile = $('new-post-image').files[0];
    $('new-post-error').textContent = '';
    if (!title || !body){
      $('new-post-error').textContent = 'Title and body are required.';
      return;
    }
    const formData = new FormData();
    formData.append('title', title);
    formData.append('body', body);
    if (tags) formData.append('tags', tags);
    if (imageFile) formData.append('image', imageFile);

    try{
      const res = await fetch(API_BASE + '/posts', {
        method: 'POST',
        headers: token ? { 'Authorization': 'Bearer ' + token } : undefined,
        body: formData
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Failed to publish');

      $('new-post-title').value = '';
      $('new-post-body').value = '';
      $('new-post-tags').value = '';
      $('new-post-image').value = '';
      $('new-post-preview').style.display = 'none';
      $('cancel-post-btn').click();
      toast('Post published 🌿');
      await loadPosts(1);
      await loadStats();
    } catch(e){
      $('new-post-error').textContent = e.message;
    }
  };

  // ---------- full-screen post reading ----------
  async function openPost(id){
    const post = posts.find(p => p._id === id);
    if (!post) return;
    $('read-title').textContent = post.title;
    $('read-overlay').classList.add('open');
    $('read-body').innerHTML = `
      <div class="byline">by <b>${escapeHtml(post.author && post.author.name || 'unknown')}</b> · ${timeAgo(post.createdAt)}</div>
      ${post.imageUrl ? `<img src="${post.imageUrl}" style="width:100%; height:auto; max-height:70vh; border-radius:16px; margin-bottom:18px; object-fit:contain; background:var(--surface-soft);">` : ''}
      <p class="content">${escapeHtml(post.body)}</p>
      ${post.tags && post.tags.length ? `<div class="tags-row">${post.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <h3 style="font-size:14px; color:var(--sage-deep); margin:30px 0 8px;">Comments</h3>
      <div id="comment-list"><div class="empty" style="margin-top:10px;">Loading…</div></div>
      ${currentUser ? `
        <div class="form-card" style="margin-top:18px;">
          <div style="font-size:12px; color:var(--text-dim); margin-bottom:8px;">Commenting as <b style="color:var(--sage-deep);">${escapeHtml(currentUser.name)}</b></div>
          <div class="field" style="margin-bottom:12px;"><textarea id="new-comment-text" placeholder="Add a comment…" style="min-height:54px;"></textarea></div>
          <div class="form-error" id="new-comment-error"></div>
          <div class="form-actions">
            <button class="solid-btn" id="submit-comment-btn">Add comment</button>
          </div>
        </div>
      ` : `<div class="locked-note" style="margin-top:18px;">Log in to add a comment.</div>`}
    `;
    const submitCommentBtn = $('submit-comment-btn');
    if (submitCommentBtn){
      submitCommentBtn.onclick = async () => {
        const text = $('new-comment-text').value.trim();
        $('new-comment-error').textContent = '';
        if (!text){ $('new-comment-error').textContent = 'Write a comment first.'; return; }
        try{
          await api('POST', `/posts/${id}/comments`, { text });
          $('new-comment-text').value = '';
          toast('Comment added');
          loadComments(id);
        } catch(e){
          $('new-comment-error').textContent = e.message;
        }
      };
    }
    loadComments(id);
  }

  async function loadComments(postId){
    try{
      const comments = await api('GET', `/posts/${postId}/comments`);
      const list = $('comment-list');
      if (!comments.length){
        list.innerHTML = '<div class="empty" style="margin-top:10px;">No comments yet.</div>';
        return;
      }
      list.innerHTML = comments.map(c => `
        <div class="comment">
          <div class="who">${escapeHtml(c.author && c.author.name || 'unknown')} · ${timeAgo(c.createdAt)}</div>
          <div class="txt">${escapeHtml(c.text)}</div>
        </div>
      `).join('');
    } catch(e){
      $('comment-list').innerHTML = '<div class="empty" style="margin-top:10px;">Could not load comments.</div>';
    }
  }

  function closeReadModal(){ $('read-overlay').classList.remove('open'); }
  $('read-close').onclick = closeReadModal;
  $('read-overlay').onclick = (e) => { if (e.target.id === 'read-overlay') closeReadModal(); };

  // ---------- auth modal wiring ----------
  $('auth-modal-close').onclick = closeAuthModal;
  $('auth-overlay').onclick = (e) => { if (e.target.id === 'auth-overlay') closeAuthModal(); };
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      $(tab.dataset.tab + '-panel').classList.add('active');
    };
  });
  $('login-form').addEventListener('submit', (e) => { e.preventDefault(); login(); });
  $('register-form').addEventListener('submit', (e) => { e.preventDefault(); register(); });

  // ---------- boot ----------
  async function boot(){
    loadSession();
    if (token){
      // verify the stored token is still valid and refresh the user's data
      try{
        const user = await api('GET', '/users/me');
        currentUser = user;
        saveSession();
      } catch(e){
        token = null; currentUser = null; clearSession();
      }
    }
    renderAccountArea();
    await Promise.all([loadPosts(), loadStats()]);
  }

  boot();
})();
</script>
</body>
</html>
